name: pqcc

# Server and cert generator: OpenSSL 3.5.7 frozen at Round 1's build (server/Dockerfile).
x-server-image: &server-image
  build: { context: ./server }
  image: pqcc/server:local

# Every client image exposes the same entrypoint contract (see clients/common/openssl-run.sh).
x-client: &client
  profiles: [clients]
  volumes:
    - ./certs/out:/certs/out:ro
  entrypoint: ["pqcc-client"]

services:
  certgen:
    <<: *server-image
    profiles: [tools]
    volumes:
      - ./certs:/certs
    entrypoint: ["bash", "/certs/gen.sh"]

  server:
    <<: *server-image
    volumes:
      - ./certs/out:/certs/out:ro
      - ./server:/server:ro
    entrypoint: ["bash", "/server/start.sh"]
    networks:
      default:
        aliases: [server.pqcc.test]

  openssl35:
    <<: *client
    build: { context: ./clients, dockerfile: openssl35/Dockerfile }
    image: pqcc/openssl35:local

  openssl30:
    <<: *client
    build: { context: ./clients, dockerfile: openssl30/Dockerfile }
    image: pqcc/openssl30:local

  java:
    <<: *client
    build: { context: ./clients, dockerfile: java/Dockerfile }
    image: pqcc/java:local

  # Same image as java, with Bouncy Castle registered first.
  java-bc:
    <<: *client
    image: pqcc/java:local
    environment:
      PQCC_PROVIDER: bc

  # java-bc with ML-DSA signature schemes switched on (off by default in BCJSSE).
  # The list is BCJSSE's default set with mldsa44/65/87 prepended.
  java-bc-pq:
    <<: *client
    image: pqcc/java:local
    environment:
      PQCC_PROVIDER: bc
      PQCC_JAVA_OPTS: >-
        -Djdk.tls.client.SignatureSchemes=mldsa44,mldsa65,mldsa87,ed25519,ed448,ecdsa_secp256r1_sha256,ecdsa_secp384r1_sha384,ecdsa_secp521r1_sha512,ecdsa_brainpoolP256r1tls13_sha256,ecdsa_brainpoolP384r1tls13_sha384,ecdsa_brainpoolP512r1tls13_sha512,rsa_pss_pss_sha256,rsa_pss_pss_sha384,rsa_pss_pss_sha512,rsa_pss_rsae_sha256,rsa_pss_rsae_sha384,rsa_pss_rsae_sha512,rsa_pkcs1_sha256,rsa_pkcs1_sha384,rsa_pkcs1_sha512

  go:
    <<: *client
    build: { context: ./clients, dockerfile: go/Dockerfile }
    image: pqcc/go:local

  # Google Chrome ships for linux/amd64 only; on Apple Silicon this needs Colima with Rosetta.
  # chrome trusts the root via Chrome's CACertificates policy (Chrome's own verifier);
  # chrome-nss uses the user NSS database, which in NSS 3.98 cannot store ML-DSA certs/keys.
  # Client certificates for mTLS always come from NSS (the only source on Linux).
  chrome:
    <<: *client
    build: { context: ./clients, dockerfile: chrome/Dockerfile }
    image: pqcc/chrome:local
    platform: linux/amd64
    shm_size: 2gb
    environment:
      PQCC_CHROME_TRUST: policy

  chrome-nss:
    <<: *client
    image: pqcc/chrome:local
    platform: linux/amd64
    shm_size: 2gb
    environment:
      PQCC_CHROME_TRUST: nss

  # Firefox always verifies through NSS (its own bundled copy). The two rows differ in how the
  # root gets in: the Certificates.Install enterprise policy, or certutil into the profile.
  # mTLS: both import the client identity with pk12util (Ubuntu 26.04 NSS tools, as in chrome).
  firefox:
    <<: *client
    build: { context: ./clients, dockerfile: firefox/Dockerfile }
    image: pqcc/firefox:local
    shm_size: 2gb
    environment:
      PQCC_FIREFOX_TRUST: policy

  firefox-nss:
    <<: *client
    image: pqcc/firefox:local
    shm_size: 2gb
    environment:
      PQCC_FIREFOX_TRUST: nss

  # .NET SslStream on Linux delegates TLS and chain building to the system OpenSSL, so the
  # result depends on the base image: the default .NET 10 image (Ubuntu 24.04, OpenSSL 3.0)
  # and the Ubuntu 26.04 variant (OpenSSL 3.5). Same program as the Windows/macOS rows.
  dotnet:
    <<: *client
    build: { context: ./clients, dockerfile: dotnet/Dockerfile }
    image: pqcc/dotnet:local

  dotnet-ossl35:
    <<: *client
    build:
      context: ./clients
      dockerfile: dotnet/Dockerfile
      args:
        RUNTIME_IMAGE: mcr.microsoft.com/dotnet/runtime:10.0.14-resolute@sha256:89f13dc68c47e341ac875da5f2a6fd3e231cd886ed204d296439d7fd9224a682
    image: pqcc/dotnet-ossl35:local
